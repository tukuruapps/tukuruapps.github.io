<style>
/* Layout: one-column puzzle surface — header, status strip, square board, two icon tools, (ad footer) */
:root{
  --bg:#eef3ea; --surface:#fbfcf8; --ink:#23302a; --muted:#66756c; --line:#2f3d35;
  --accent:#e08a1e; --accent-ink:#ffffff; --heart:#d9455f; --soft:#dfe7da; --ok:#3f8f5b;
  --r0:#f6d6a8; --r1:#c9e2b3; --r2:#b9d7ee; --r3:#f3c3c8; --r4:#d9cdf0; --r5:#f4ecb0; --r6:#bfe6dd; --r7:#e8d2bc; --r8:#d0d9e2; --r9:#f4b6a4;
  --x:#59675f; --scrim:rgba(238,243,234,.88);
  --display:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
}
html:lang(ko){--display:"Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif}
html:lang(ko) body{word-break:keep-all;overflow-wrap:anywhere}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18201c; --surface:#212b26; --ink:#e9efe9; --muted:#9fb0a5; --line:#0b100d;
  --accent:#f0a040; --accent-ink:#1b1408; --heart:#ff6b84; --soft:#2c3832; --ok:#6cc48a;
  --r0:#7a6140; --r1:#4f6a42; --r2:#3f5d78; --r3:#7a4a52; --r4:#5a4c7a; --r5:#77703e; --r6:#3c6f66; --r7:#6e5944; --r8:#4c5864; --r9:#8a4a3c;
  --x:#c3cec7; --scrim:rgba(24,32,28,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18201c; --surface:#212b26; --ink:#e9efe9; --muted:#9fb0a5; --line:#0b100d;
  --accent:#f0a040; --accent-ink:#1b1408; --heart:#ff6b84; --soft:#2c3832; --ok:#6cc48a;
  --r0:#7a6140; --r1:#4f6a42; --r2:#3f5d78; --r3:#7a4a52; --r4:#5a4c7a; --r5:#77703e; --r6:#3c6f66; --r7:#6e5944; --r8:#4c5864; --r9:#8a4a3c;
  --x:#c3cec7; --scrim:rgba(24,32,28,.9); color-scheme:dark}
/* ===== デザイン「夜の農場」 ===== */
html.farm:root{
  --bg:#0c1330; --surface:#18213f; --ink:#f4f1e4; --muted:#aeb6d2; --line:#2a1b0f;
  --accent:#f5c02a; --accent-ink:#2a1d00; --heart:#ff6b84; --soft:#2b3558; --ok:#7fd36b;
  /* 色ごとの畑：0 カボチャ／1 トウモロコシ／2 池／3 花畑／4 ラベンダー／5 麦／6 キャベツ／7 わら／8 石だたみ */
  --r0:#ff8a2a; --r1:#45c23e; --r2:#1f6ff2; --r3:#e8305a; --r4:#8a3ee8; --r5:#ffc61e; --r6:#1fc3d6; --r7:#b9813f; --r8:#7d8ca3; --r9:#ef4fb6;
  --x:#fff6dc; --scrim:rgba(12,19,48,.88); color-scheme:dark}
html.farm body{background:#0c1330}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
html.farm #scene{display:block}
html.farm .wrap{position:relative;z-index:1}
html.farm h1{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
html.farm .roundbtn{background:rgba(12,19,48,.72);border-color:rgba(255,255,255,.55);color:#fff}
html.farm .lv{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
html.farm .lv small,html.farm .lv .chev{color:#d6dcf2}
html.farm .board{border:7px solid #1a2342;border-radius:18px;background:#1a2342;box-shadow:0 0 0 1.5px #3a4670,0 16px 40px rgba(0,0,0,.6)}
html.farm .board .ffb{position:absolute;width:4px;height:4px;border-radius:50%;background:#efff9a;box-shadow:0 0 7px 3px rgba(220,255,120,.5);pointer-events:none;z-index:3;animation:ff 7s ease-in-out infinite}
.board .ffb{display:none}html.farm .board .ffb{display:block}
html.farm #scene{background:linear-gradient(#08102a 0%,#0f1a40 45%,#1a2858 72%,#0c1a1c 100%)}
html.farm #scene .ff,html.farm .board .ffb{display:none}
/* 盤面の上からのぞくエイリアン（夜の農場） */
.peek{position:absolute;left:50%;top:0;width:0;transform:translateX(-50%);pointer-events:none;z-index:3;display:none}
html.farm .peek.on{display:block}
.peek svg{display:block;width:100%;height:auto;overflow:visible}
.peek .ph{animation:peekBob 3.4s ease-in-out infinite}
.peek .pe{transform-box:fill-box;transform-origin:center;animation:peekBlink 5.2s infinite}
@keyframes peekBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes peekBlink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){.peek .ph,.peek .pe{animation:none}}
#scene .sc-stars{position:absolute;inset:0;width:100%;height:100%}
#scenecv{position:absolute;left:0;top:0;width:100%;height:100%}
#moon{position:absolute;left:var(--mx,70%);top:var(--my,80px);width:var(--ms,56px);height:var(--ms,56px);border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#fff6d6,#ecdcae 70%,#cdb98a);box-shadow:0 0 30px 12px rgba(255,243,196,.25),0 0 80px 30px rgba(255,243,196,.12)}
#moon::before,#moon::after{content:"";position:absolute;border-radius:50%;background:rgba(200,181,138,.45)}
#moon::before{left:28%;top:28%;width:18%;height:18%}#moon::after{left:58%;top:58%;width:12%;height:12%}
#moon.off{display:none}
html.farm .tool{background:rgba(12,19,48,.88);border-color:rgba(255,255,255,.4);color:#fff}
html.farm .tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
html.farm .adbar{border-color:rgba(255,255,255,.25);color:#cfd5ea}
#scene .ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#e9ff8a;box-shadow:0 0 8px 3px rgba(220,255,120,.55);animation:ff 6s ease-in-out infinite}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.15}30%{opacity:1}50%{transform:translate(14px,-18px);opacity:.8}75%{opacity:.3}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

.wrap{height:100%;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 14px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:42px;height:42px;flex:none}
h1{font-family:var(--display);font-weight:900;font-size:24px;margin:0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{display:flex;align-items:center;gap:8px;flex:none}
.roundbtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--soft);background:var(--surface);color:var(--ink);font:800 17px var(--display);cursor:pointer;display:grid;place-items:center;padding:0}
.roundbtn svg{width:20px;height:20px}

.status{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lv{border:0;background:none;padding:0;color:var(--ink);font:800 18px var(--display);cursor:pointer;display:flex;align-items:baseline;gap:6px;text-align:left}
.lv small{font:400 12px var(--body);color:var(--muted);letter-spacing:.04em}
.lv .chev{font-size:11px;color:var(--muted)}
.hearts{display:flex;gap:4px}
.hearts svg{width:22px;height:22px;transition:transform .2s,opacity .2s}
.hearts svg.lost{opacity:.22;transform:scale(.8)}

.board-wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.board{position:relative;width:100%;aspect-ratio:1;max-width:100%;border:3px solid var(--line);border-radius:10px;background:var(--line);touch-action:none;cursor:pointer}
.board canvas{display:block;width:100%;height:100%}
/* クリア演出（UFO）用：画面全体に重ねるキャンバス。タップで演出を飛ばせる */
#fxcv{position:fixed;inset:0;width:100%;height:100%;z-index:9;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);border-radius:10px;z-index:5}

.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tool:disabled{cursor:default}.tool:disabled svg{opacity:.3}
.tool{position:relative;display:grid;place-items:center;border:2px solid var(--soft);background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 6px;cursor:pointer;min-height:56px}
.tool svg{width:30px;height:30px}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="false"] svg{opacity:.55}
.badge{position:absolute;top:6px;right:calc(50% - 34px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:900 13px/22px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.badge.ad{background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:0 5px}
.badge.ad svg{width:16px;height:16px;opacity:1}
.badge.ad{font-size:10px;letter-spacing:.02em}
.adask{text-align:center}
.adask .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.adask-tag{width:max-content;margin:0 auto 4px;align-self:center;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);font:800 13px var(--display);padding:4px 12px;border-radius:999px}
.adask-tag svg{width:18px;height:18px}
.adask p{margin:6px 0 16px;color:var(--muted)}
.tool:focus-visible,.roundbtn:focus-visible,.lv:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.adbar{height:50px;flex:none;border:2px dashed var(--soft);border-radius:8px;display:grid;place-items:center;color:var(--muted);font:700 12px var(--body);letter-spacing:.08em}

.card{background:var(--surface);border-radius:14px;padding:14px 16px}
.card h2{font-family:var(--display);font-size:18px;margin:0}
.sheet{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:var(--bg)}
/* 設定などを開いている間は、後ろのゲーム画面を描かない（裏で表示がずれて見えるのを防ぐ） */
body.modal .wrap,body.modal .hintcard{visibility:hidden}
.sheet .card{max-width:440px;width:100%;max-height:100%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgb(0 0 0/.18)}
.sheet .btn{align-self:center}
.scroll,.scroll *{touch-action:pan-y}

.howto{gap:14px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hw{background:var(--bg);border-radius:12px;padding:10px 8px;display:grid;place-items:center}
.hw.wide{grid-column:1/-1}
/* 横に広い画面（折りたたみ端末を開いたとき・タブレット）：4列に並べて、スクロールせずに収める */
@media (min-width:600px){.sheet .card.howto{max-width:760px}.hgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.hw.wide{grid-column:span 2}}
.hw>svg{display:block;width:100%;height:auto;overflow:visible}
.iconbtn{display:grid;place-items:center;width:72px;height:48px;padding:0}
.iconbtn svg{width:26px;height:26px}
.hw-ring{transform-box:fill-box;transform-origin:center;animation:hwRing 2.6s ease-out infinite}
.hw-ring.d2{animation-delay:.32s}
.hw-res{animation:hwRes 2.6s ease infinite}
.hw-res.d2{animation-delay:.32s}
.hw-move{animation:hwMove 2.8s ease-in-out infinite}
.hw-seq{animation:hwSeq 2.8s ease infinite backwards}
.hw-lose{opacity:.18;animation:hwLose 2.6s ease infinite}
.hw-bad{animation:hwBad 2.6s ease infinite}
@keyframes hwRing{0%{transform:scale(.3);opacity:0}6%{opacity:.95}34%,100%{transform:scale(1.6);opacity:0}}
@keyframes hwRes{0%,26%{opacity:0}36%,88%{opacity:1}100%{opacity:0}}
@keyframes hwMove{0%{transform:translateX(-72px);opacity:0}8%{opacity:1}62%{transform:translateX(0);opacity:1}80%,100%{transform:translateX(0);opacity:0}}
@keyframes hwSeq{0%{opacity:0}6%,82%{opacity:1}96%,100%{opacity:0}}
@keyframes hwLose{0%,30%{opacity:1}44%,88%{opacity:.18}100%{opacity:1}}
@keyframes hwBad{0%,20%{opacity:0}30%,88%{opacity:1}100%{opacity:0}}

.lvgrid{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-height:min(58vh,440px);overflow-y:auto;padding:2px;overscroll-behavior:contain}
.lvtile{border:2px solid var(--soft);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font:800 16px var(--display);font-variant-numeric:tabular-nums}
.lvtile span{font:900 11px var(--body);color:var(--ok);min-height:15px}
.lvtile.done{background:var(--r1);border-color:var(--r1)}
.lvtile.cur{border-color:var(--accent)}
.lvtile.lock{cursor:default;color:var(--muted);opacity:.45;border-style:dashed}
.lvtile.lock span{color:var(--muted)}
.lvtile.lock svg{display:block;margin-top:2px}
/* 年齢の確認（初回だけ）：初期値なしで、どの年でも選べる */
.agehead{display:grid;place-items:center}.agehead svg{width:56px;height:56px}
.agecard h2{text-align:center}
.agegrid .lvtile{padding:10px 2px}
.agegrid .lvtile.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:default}

.setlist{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--bg)}
.setrow,.setlink{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;min-height:52px;font:700 15px var(--body);color:var(--ink)}
.setrow+.setrow,.setrow+.setlink,.setlink+.setlink{border-top:1px solid var(--soft)}
.setlink{border:0;background:none;width:100%;text-align:left;cursor:pointer}
.setlink .go{color:var(--muted);font-weight:400}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:700 13px var(--body);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:var(--soft);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0/.25);transition:left .15s}
.switch[aria-pressed="true"]{background:var(--ok)}
.switch[aria-pressed="true"]::after{left:23px}
.ver{margin:0;text-align:center;color:var(--muted);font-size:12px}
.addbg{white-space:pre-line;text-align:left;font:11px/1.5 ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:6px 8px;-webkit-user-select:text;user-select:text;word-break:break-all}
.doc{max-height:min(62vh,520px);overflow-y:auto;font-size:13.5px;line-height:1.7;color:var(--ink);-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.doc h3{font-size:14px;margin:14px 0 4px}
.doc p,.doc ol{margin:0 0 6px}
.doc ol{padding-left:1.3em}
.doc a{color:var(--accent);word-break:break-all}
.doc .muted{color:var(--muted);font-size:12px;margin-top:12px}

.panel{background:var(--surface);border-radius:18px;padding:20px 22px;text-align:center;box-shadow:0 8px 30px rgb(0 0 0/.18);display:flex;flex-direction:column;gap:8px;align-items:center;max-width:88%}
.panel{position:relative}
.panel .praise{font:900 30px/1.15 var(--display);color:var(--accent);letter-spacing:.02em;text-shadow:0 2px 0 rgb(0 0 0/.08);animation:praise .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes praise{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.panel .stamp{position:absolute;top:6px;right:-14px;width:78px;height:78px;border-radius:50%;border:4px solid #e0473c;color:#e0473c;display:grid;place-items:center;
  font:900 15px/1.05 var(--display);text-align:center;box-shadow:inset 0 0 0 3px rgba(224,71,60,.25);background:rgba(255,255,255,.04);
  transform:rotate(-14deg);opacity:0;animation:stamp .42s .6s cubic-bezier(.3,1.5,.5,1) forwards;pointer-events:none}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(2.6)}70%{opacity:1;transform:rotate(-14deg) scale(.9)}100%{opacity:.93;transform:rotate(-14deg) scale(1)}}
.panel.stamped{animation:thud .25s 1s ease-out}
@keyframes thud{30%{transform:translate(2px,3px)}60%{transform:translate(-2px,-1px)}}
.panel .total{font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}
.panel .total b{font:800 19px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.panel .total .plus{margin-left:6px;font:800 13px var(--display);color:var(--ok);display:inline-block;animation:praise .5s .5s cubic-bezier(.2,1.6,.4,1) both}
.panel .total small{font-size:12px}
html.farm .overlay{background:radial-gradient(ellipse at 50% 50%,rgba(6,10,32,.82) 35%,rgba(6,10,32,.45) 62%,rgba(6,10,32,0) 80%)}
.panel .mstamp{position:absolute;top:6px;left:-14px;width:82px;height:82px;border-radius:50%;border:4px solid #d9a21b;color:#b8860b;display:grid;place-items:center;
  font:900 13px/1.1 var(--display);text-align:center;background:radial-gradient(circle,#fff6c8,#ffe48a);box-shadow:0 2px 8px rgba(150,110,0,.35),inset 0 0 0 3px rgba(217,162,27,.35);
  transform:rotate(12deg);opacity:0;animation:mstamp .5s .35s cubic-bezier(.3,1.5,.5,1) forwards;pointer-events:none}
@keyframes mstamp{0%{opacity:0;transform:rotate(12deg) scale(2.6)}70%{opacity:1;transform:rotate(12deg) scale(.9)}100%{opacity:1;transform:rotate(12deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.panel .mstamp{opacity:1}}
#cfcv{position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}
@media (prefers-reduced-motion:reduce){.panel .stamp{opacity:.93}}
.panel h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.em{color:var(--accent);font-weight:800}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:800 15px var(--display);padding:10px 22px;border-radius:999px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.tutcard{flex:none;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
.tutcard p{margin:0;font-weight:700;font-size:15px;line-height:1.55;min-height:3.1em}
.tutcard p.miss{color:var(--heart)}
.tut-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.tut-skip{border:0;background:none;color:var(--muted);font:700 13px var(--body);padding:8px 4px;cursor:pointer}
.tut-dots{display:flex;gap:6px}
.tut-dots i{width:7px;height:7px;border-radius:50%;background:var(--soft)}
.tut-dots i.on{background:var(--accent)}
.tutcard .iconbtn{width:64px;height:44px}
.tutcard .iconbtn.wait{visibility:hidden}
body.tut header,body.tut .status{display:none}

.chslides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;touch-action:pan-x;scrollbar-width:none;overscroll-behavior:contain;margin:0 -2px;padding:0 2px}
.chslides::-webkit-scrollbar{display:none}
.chslides.nudge{scroll-snap-type:none} /* 動いている間はスナップを止める（右のコースでは、もどされてしまうため） */

.chslide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;gap:9px;min-width:0}
.chslide .btn{align-self:stretch}
.chsl-h{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px}

.chdots{display:flex;justify-content:center;gap:8px;margin-top:4px}

/* チャレンジコース2：牛をあつめるミニゲーム */

<script>
/* ========== アプリ設定（公開前にここを書き換えてください） ========== */

  version:'1.0.6',
  developer:'tukuruapps', // 開発者名（任意。本名でなくてもよく、Google Play のデベロッパー名と同じにするのがおすすめ）。空なら「本アプリの開発者」と表示
  contact:'tukuruapps@gmail.com', // お問い合わせ先（必須）：メールアドレス、またはお問い合わせフォームのURL。利用規約とプライバシーポリシーに表示

/* ========== core (pure logic) ========== */
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function placeAliens(n,r){
  const cols=new Array(n);const used=new Array(n).fill(false);
  function bt(row){if(row===n)return true;
    for(const c of shuffle([...Array(n).keys()],r)){
      if(used[c])continue; if(row>0&&Math.abs(cols[row-1]-c)<=1)continue;
      cols[row]=c;used[c]=true; if(bt(row+1))return true; used[c]=false;}
    return false}
  return bt(0)?cols:null}
function growRegions(n,cols,r){
  const reg=new Array(n*n).fill(-1);const fronts=[];
  for(let i=0;i<n;i++){reg[i*n+cols[i]]=i;fronts.push([i*n+cols[i]])}
  let left=n*n-n;
  while(left>0){
    const k=Math.floor(r()*n);const f=fronts[k];if(!f.length)continue;
    const idx=Math.floor(r()*f.length);const cell=f[idx];
    const y=Math.floor(cell/n),x=cell%n;
    const nb=shuffle([[y-1,x],[y+1,x],[y,x-1],[y,x+1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&reg[a*n+b]===-1),r);
    if(!nb.length){f.splice(idx,1);continue}
    const [a,b]=nb[0];reg[a*n+b]=k;f.push(a*n+b);left--;
  }
  return reg}
function altSolution(n,reg,truth){
  const colU=new Array(n).fill(false),regU=new Array(n).fill(false),s=[];let found=null;
  function bt(row,pc){if(found)return;if(row===n){if(s.some((c,i)=>c!==truth[i]))found=s.slice();return}
    for(let c=0;c<n;c++){if(colU[c]||Math.abs(c-pc)<=1)continue;const g=reg[row*n+c];if(regU[g])continue;
      colU[c]=regU[g]=true;s[row]=c;bt(row+1,c);colU[c]=regU[g]=false;if(found)return}}
  bt(0,-9);return found}
function connectedWithout(n,reg,g,skip){
  const cellsG=[];for(let i=0;i<n*n;i++)if(reg[i]===g&&i!==skip)cellsG.push(i);
  if(!cellsG.length)return false;const seen=new Set([cellsG[0]]),st=[cellsG[0]];
  while(st.length){const c=st.pop(),y=Math.floor(c/n),x=c%n;
    for(const [a,b] of [[y-1,x],[y+1,x],[y,x-1],[y,x+1]]){if(a<0||b<0||a>=n||b>=n)continue;const j=a*n+b;if(j!==skip&&reg[j]===g&&!seen.has(j)){seen.add(j);st.push(j)}}}
  return seen.size===cellsG.length}
// 別解が無くなるまで区画の形を少しずつ変える
function repair(n,reg,cols,r){
  const alienCells=new Set(cols.map((c,y)=>y*n+c));
  for(let step=0;step<n*n*6;step++){
    const alt=altSolution(n,reg,cols);if(!alt)return reg;
    const bad=shuffle(alt.map((c,y)=>y*n+c).filter(i=>!alienCells.has(i)),r);
    let moved=false;
    for(const i of bad){const y=Math.floor(i/n),x=i%n,g=reg[i];
      const nbs=shuffle([[y-1,x],[y+1,x],[y,x-1],[y,x+1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&reg[a*n+b]!==g),r);
      if(!nbs.length||!connectedWithout(n,reg,g,i))continue;
      const [a,b]=nbs[0];reg[i]=reg[a*n+b];moved=true;break}
    if(!moved)return null}
  return null}

/* ---------- 論理ソルバー（推測なし） ---------- */
// ユニット＝行(0..n-1)・列(n..2n-1)・区画(2n..3n-1)。どのユニットにもエイリアンはちょうど1匹。
function geom(n,reg){
  const units=[];for(let k=0;k<3*n;k++)units.push([]);
  const cu=[],nb=[];
  for(let i=0;i<n*n;i++){const y=Math.floor(i/n),x=i%n;
    units[y].push(i);units[n+x].push(i);units[2*n+reg[i]].push(i);cu.push([y,n+x,2*n+reg[i]]);
    const a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dy&&!dx)continue;const yy=y+dy,xx=x+dx;if(yy>=0&&xx>=0&&yy<n&&xx<n)a.push(yy*n+xx)}nb.push(a)}
  const block=[];for(let i=0;i<n*n;i++){const s=new Set();for(const u of cu[i])for(const j of units[u])s.add(j);for(const j of nb[i])s.add(j);s.delete(i);block.push([...s])}
  return {n,reg,units,cu,nb,block};
}
function newState(G){return {cand:new Uint8Array(G.n*G.n).fill(1),alien:new Uint8Array(G.n*G.n)}}
function stPlace(G,st,i){st.alien[i]=1;st.cand[i]=0;for(const j of G.block[i])st.cand[j]=0}
function unitOpen(G,st,u){for(const i of G.units[u])if(st.alien[i])return false;return true}
function unitCands(G,st,u){const r=[];for(const i of G.units[u])if(st.cand[i])r.push(i);return r}
function combos(arr,k,f){const c=[];return (function rec(s){if(c.length===k)return f(c.slice());for(let t=s;t<arr.length;t++){c.push(arr[t]);if(rec(t+1))return true;c.pop()}return false})(0)}
// 次の一手を、かんたんな理由から順に探す
function nextStep(G,st,maxK){
  const n=G.n;maxK=maxK||4;
  for(let u=0;u<3*n;u++){if(!unitOpen(G,st,u))continue;const c=unitCands(G,st,u);
    if(c.length===0)return {type:'dead',unit:u};
    if(c.length===1)return {type:'single',cell:c[0],unit:u,score:1}}
  for(let k=1;k<=maxK;k++){
    for(let A=0;A<3;A++)for(let B=0;B<3;B++){if(A===B)continue;
      const openA=[];for(let t=0;t<n;t++){const u=A*n+t;if(unitOpen(G,st,u))openA.push(u)}
      if(openA.length<=k)continue;
      let found=null;
      combos(openA,k,S=>{const T=new Set(),inS=new Set();
        for(const u of S)for(const i of G.units[u])if(st.cand[i]){inS.add(i);T.add(G.cu[i][B])}
        if(T.size!==k)return false;
        const elim=[];for(const v of T)for(const i of G.units[v])if(st.cand[i]&&!inS.has(i))elim.push(i);
        if(elim.length){found={type:'confine',A,B,S,T:[...T],elim,cells:[...inS],k,score:k===1?1:k};return true}
        return false});
      if(found)return found}
    if(k===1){
      for(let i=0;i<n*n;i++){if(!st.cand[i])continue;const bl=new Set(G.block[i]);
        for(let u=0;u<3*n;u++){if(G.cu[i].includes(u)||!unitOpen(G,st,u))continue;
          const c=unitCands(G,st,u);if(c.length&&c.every(j=>bl.has(j)))return {type:'contra',cell:i,unit:u,elim:[i],cells:c,score:2}}}
    }
  }
  return null;
}
function applyStep(G,st,s){if(s.type==='single')stPlace(G,st,s.cell);else for(const i of s.elim)st.cand[i]=0}
function logicSolve(n,reg){
  const G=geom(n,reg),st=newState(G);let maxScore=0,hard=0;
  for(let guard=0;guard<500;guard++){
    let placed=0;for(let i=0;i<n*n;i++)placed+=st.alien[i];
    if(placed===n)break;
    const s=nextStep(G,st);if(!s||s.type==='dead')return {ok:false};
    maxScore=Math.max(maxScore,s.score);if(s.score>=2)hard++;applyStep(G,st,s)}
  const sol=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(st.alien[y*n+x])sol[y]=x;
  return {ok:sol.length===n&&sol.every(v=>v!=null),sol,maxScore,hard};
}
// 先読み（達人）：ここに置くと、数手先でどこかにエイリアンを置けなくなる → ここにはいない
function chainStep(G,st){
  const n=G.n,N=n*n,cands=[];for(let i=0;i<N;i++)if(st.cand[i])cands.push(i);
  const score=i=>Math.min(...G.cu[i].map(u=>unitCands(G,st,u).length)); // 候補の少ないところから試す
  cands.sort((a,b)=>score(a)-score(b)||a-b);
  for(const lim of [3,6,12,24]){
    for(const i of cands){
      const cp={cand:st.cand.slice(),alien:st.alien.slice()};stPlace(G,cp,i);
      for(let d=1;d<=lim;d++){const s=nextStep(G,cp,1);if(!s)break;
        if(s.type==='dead')return {type:'chain',cell:i,unit:s.unit,elim:[i],cells:[i],depth:d,score:4};
        applyStep(G,cp,s);let placed=0;for(let k=0;k<N;k++)placed+=cp.alien[k];if(placed===n)break}}}
  return null}
// 種から1問だけ作る（10×10・達人は、前もって確かめた種を使う）
function buildOne(n,seed){const r=rng(seed);
  for(let t=0;t<40;t++){const cols=placeAliens(n,r);if(!cols)continue;const reg=repair(n,growRegions(n,cols,r),cols,r);if(!reg)continue;return {n,reg,sol:cols}}
  return null}
function gradeOf(r){if(r.maxScore>=3||r.hard>=6)return 3;if(r.maxScore>=2)return 2;return 1}
// 答えが1つだけで、しかも推理だけで解ける問題を作る（want＝目標の難しさ）
function generate(n,seed,want){
  const r=rng(seed);let fallback=null;
  for(let t=0;t<400;t++){
    const cols=placeAliens(n,r);if(!cols)continue;
    const reg=repair(n,growRegions(n,cols,r),cols,r);if(!reg)continue;
    const res=logicSolve(n,reg);if(!res.ok)continue;
    const p={n,reg,sol:cols,grade:gradeOf(res)};
    if(!want||p.grade===want)return p;
    if(!fallback)fallback=p;
    if(t>=24)return fallback;
  }
  return fallback;
}
function levelSpec(level){
  const r=rng(level*104729+7);
  if(level>100){const n=r()<.4?9:10,x=r(),want=x<.15?1:x<.45?2:x<.78?3:4;return {n,want,seed:level*7919+13,big:true}} // レベル101〜：10×10と達人も出る
  const n=level<=3?5:level<=12?6:level<=30?7:level<=60?8:(r()<.5?8:9);
  let want;if(level<=5)want=1;else if(level<=20)want=r()<.6?1:2;else{const x=r();want=x<.25?1:x<.65?2:3}
  return {n,want,seed:level*7919+13};
}
// レベル101〜の問題：10×10と達人は、前もって「すぐ作れて、その難しさになる」と確かめた種から作る
const POOL_MUL=104723,POOL_ADD=17;
const POOLS={"m9":[186,192,203,226,235,238,266,344,350,411,435,456,483,531,556,672,676,679,693,732,812,840,857,913,930,944,946,965,980,1008,1054,1122,1146,1166,1191,1195,1196,1210,1221,1225,1244,1258,1260,1278,1288],"m10":[20,29,88,89,150,275,285,288,309,331,366,487,517,533,535,549,562,583,584,587,592,593,835,980,981,1020,1082,1130,1160,1192],"g1":[73,76,129,319,401,407,420,422,426,430,525,547,598,602,675,683,693,720,815,913,1001,1045,1084,1157],"g2":[55,87,106,108,112,143,148,218,246,261,272,290,296,315,379,389,390,395,398,399,439,443,477,478,482,534,555,559,566,575,589,610,651,671,679,686,694,712,715,718,724,734,764,785,793,827,858,880,912,924,932,937,979,1025,1028,1033,1053,1071,1074,1076,1093,1099,1149,1155,1162,1165,1182],"g3":[4,13,35,38,43,44,54,66,68,71,75,80,98,104,105,114,115,124,126,132,135,172,175,182,201,202,205,206,210,221,223,225,238,242,247,251,263,265,274,276,279,280,283,293,297,298,299,306,311,312,318,330,334,355,357,370,387,396,397,414,445,458,461,464,471,476,480,494,495,508,511,530,531,538,545,551,556,560,561,579,585,588,596,599,603,607,644,649,652,655,657,668,695,696,697,739,744,756,762,775,777,786,792,798,805,809,814,826,838,845,855,863,869,876,877,878,879,883,891,893,899,909,925,928,935,940,951,952,956,965,969,974,984,991,993,1005,1014,1017,1038,1048,1049,1051,1060,1062,1086,1090,1091,1104,1114,1120,1138,1146,1148,1150,1153,1156,1180,1181,1187,1188,1198]}; // m9/m10＝達人（9×9・10×10）、g1〜g3＝10×10 のかんたん〜むずかしい
function makePuzzle(spec,level){
  if(!spec.big)return generate(spec.n,spec.seed,spec.want);
  const h=Math.imul(level,2654435761)>>>0,pick=L=>L&&L.length?L[h%L.length]:null;
  const k=spec.want===4?pick(POOLS['m'+spec.n]):spec.n===10?pick(POOLS['g'+spec.want]):null;
  if(k!=null){const p=buildOne(spec.n,k*POOL_MUL+POOL_ADD);if(p){p.grade=spec.want;return p}}
  return generate(spec.n,spec.seed,Math.min(3,spec.want))}
/* ========== end core ========== */

  el.addEventListener('pointerup',e=>{const s=st;st=null;if(!s||e.pointerId!==s.id)return;
    if(Math.hypot(e.clientX-s.x,e.clientY-s.y)>24||Date.now()-s.t>900)return;
    lastTapAt=Date.now();fn(s.target)});

/* ========== storage（アプリではアプリ本体に、ブラウザでは localStorage に保存） ========== */

// 効果音全体の音量。個々の音量はそのままに、ここでまとめて持ち上げる（重なってもリミッターで音割れしない）
const SFX_GAIN=4;let OUT=null;
function sfxOut(a){if(OUT)return OUT;try{const m=a.createGain(),c=a.createDynamicsCompressor();m.gain.value=SFX_GAIN;
  c.threshold.value=-8;c.knee.value=6;c.ratio.value=8;c.attack.value=.002;c.release.value=.12;m.connect(c).connect(a.destination);OUT=m}catch(e){OUT=a.destination}return OUT}
function makeAC(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();sfxOut(AC);setTimeout(()=>{loadMoo(AC);loadHen(AC)},30)}return AC}
function audio(){try{makeAC();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
// 音の準備（数十ミリ秒かかる）は、さいしょのタップのときではなく、起動して少したってからしておく（使うまでは止めておく）
setTimeout(()=>{try{if(!AC&&soundOn){makeAC();const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0;o.connect(g).connect(sfxOut(AC));o.start();o.stop(AC.currentTime+.01);if(AC.state==='running')setTimeout(()=>{try{AC.suspend()}catch(e){}},60)}}catch(e){}},900);
function tone(f,dur,type,vol,at,f2){const a=audio();if(!a)return;const t0=a.currentTime+(at||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(sfxOut(a));o.start(t0);o.stop(t0+dur+.02)}

function checkWin(){
  if(over||cells.filter(v=>v===3).length<puzzle.n)return;
  if(humanShown(puzzle.disguise)){ // 全員見つけたのに、まだ人間のふりをしている → 自動で正体をあらわす（そのあとクリア）

  over=true;winAt=performance.now();kick();updUndo();

  // これまでに見つけた数（エイリアン・牛・へんそう）
  const S0=store.get('stats',{a:0,c:0,h:0}),hasCow=puzzle.cow!=null,S1={a:(S0.a|0)+puzzle.n-(hasCow?1:0),c:(S0.c|0)+(hasCow?1:0),h:(S0.h|0)+(puzzle.disguise!=null?1:0)};store.set('stats',S1);
  if(chOn)chWin(hasCow);
  else{const best=store.get('best',{});best[level]=1;store.set('best',best);
    if(level<=maxLevel)maxLevel=Math.max(maxLevel,level+1); // 飛び先のクリアは「次のレベル」だけを開ける（best で判定）
    const unlock=level>=MG_LEVEL&&!store.get('mgAnnounced',false);if(unlock){store.set('mgUnlocked',true);store.set('mgAnnounced',true);rkLock()} // レベル10以上をはじめてクリア → ミニゲーム解放のお知らせ
    panel={kind:'win',miss:3-hearts,pi:Math.floor(Math.random()*12),s0:S0.a|0,s1:S1,master:puzzle.grade===4,unlock};
    store.set('level',level+1)} // 閉じても次は次のレベルから

  if(!$('hintCard').hidden)closeHint(true); // 最後の1匹がヒントで見つかった場合、ヒントはもう不要

  startUfo(()=>{sfx('win');haptic('ok');showPanelSoon()});
}

        ctx.globalAlpha=.35;ctx.fillRect(s.x-1,y,2,22)}
      else if(!s.burst){s.burst=true;sfx('cosmic',shots.indexOf(s));const n=70;for(let k=0;k<n;k++){const a=k/n*Math.PI*2+Math.random()*.1,sp=2.2+Math.random()*3.2;
        P.push({x:s.x,y:s.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.045,dr:.975,c:k%5?s.c:'#fff7d6',kind:'spark',born:t,life:1100+Math.random()*500})}}}

      else{const age=t-p.born,f=1-age/p.life;if(f<=0)continue;alive=true;ctx.globalAlpha=Math.max(0,f)*(Math.random()<.15?.5:1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,1.9,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha*=.35;ctx.beginPath();ctx.arc(p.x-p.vx*2,p.y-p.vy*2,1.4,0,Math.PI*2);ctx.fill()}}
    ctx.globalAlpha=1;
    if(!alive||t>4200){stopCelebrate();return}requestAnimationFrame(step)};
  requestAnimationFrame(step)}

/* ---------- クリア演出：UFO が飛んできて、エイリアンを光で吸い上げ、飛び去る ---------- */
let ufo=null,collected=new Set();
const EASE={io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t};

function startUfo(done){
  stopUfo();

  const order=[];for(let i=0;i<cells.length;i++)if(cells[i]===3)order.push(i); // 上の段から順に吸い上げる
  const n=order.length,S=Math.min(120,Math.max(70,700/n)),LIFT=620;
  const T={enter:650,lift0:900};T.liftEnd=T.lift0+(n-1)*S+LIFT;T.beamOff=T.liftEnd+200;T.exit0=T.beamOff+150;T.exitEnd=T.exit0+560;
  document.documentElement.classList.add('ufo-on');

  const c=$('fxcv');c.hidden=false;sizeFx();requestAnimationFrame(ufoLoop);
}
function stopUfo(){document.documentElement.classList.remove('ufo-on');ufo=null;collected=new Set();const c=$('fxcv');if(c)c.hidden=true}
function finishUfo(){document.documentElement.classList.remove('ufo-on');if(!ufo)return;const d=ufo.done;ufo.order.forEach(i=>collected.add(i));ufo=null;$('fxcv').hidden=true;draw();d&&d()}
const FXD=()=>Math.min(2,window.devicePixelRatio||1); // 画面いっぱいの演出は、こまかさを2倍までにして軽くする
function sizeFx(){const c=$('fxcv'),d=FXD();c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d)}
addEventListener('resize',()=>{if(ufo)sizeFx()});
$('fxcv').addEventListener('pointerdown',e=>{e.preventDefault();finishUfo()}); // タップで演出を飛ばす
function ufoLoop(){
  if(!ufo)return;

  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,c.width/d,c.height/d);
  const cv=$('cv');if(!cv||!puzzle){finishUfo();return}
  if(t<0){requestAnimationFrame(ufoLoop);return}
  if(!ufo.snd.in){ufo.snd.in=1;sfx('ufo')}

  if(t>=T.exit0&&!ufo.snd.zoom){ufo.snd.zoom=1;sfx('zoom')}

  if(t<T.enter){const q=EASE.out(t/T.enter),sx=-U,sy=hy-U*.9;ux=sx+(hx-sx)*q;uy=sy+(hy-sy)*q-Math.sin(q*Math.PI)*U*.12;tilt=.22*(1-q)}

  if(beam>0)drawBeam(ctx,ux,uy+U*.13,U,r,beam,t);

function drawBeam(ctx,x,y,U,r,a,t){

// 4×4 の練習問題：区画0（上の7マス）・区画1（左下）・区画2（右下・青）・区画3（1マスだけ）
const TUT={n:4,reg:[0,0,0,0, 0,0,0,3, 1,1,2,2, 1,1,2,2],sol:[1,3,0,2],grade:1};
const TUT_STEPS=[
  // ルールの見本：エイリアンを1匹置いて、いないマスに×を出す（説明が終わると消す）
  {key:'tut1',next:true,demo:{alien:5,x:[0,1,2,3,4,6]}},                 // ルール1：おなじ色に1匹
  {key:'tut1b',next:true,demo:{alien:5,x:[4,6,7,1,9,13]}},               // ルール2：よこの列・たての列に1匹ずつ
  {key:'tut1c',next:true,demo:{alien:5,x:[0,1,2,4,6,8,9,10]}},           // ルール3：となりあわない
  {key:'tut2',target:3,act:'x'},
  {key:'tut3',target:7,act:'alien'},
  {key:'tut4',next:true,ringFixed:true},
  {key:'tut5',target:14,act:'alien'},
  {key:'tut6',free:true},

function startTutorial(){
  saveNow();closeHint(true);$('overlay').hidden=true;
  tut={step:0,missT:null};
  puzzle={...TUT};G=geom(TUT.n,TUT.reg);cells=new Array(16).fill(0);hearts=3;hints=HINTS_PER_STAGE;unmasked=false;morphAt=0;stuckAt=0;
  over=false;panel=null;pendingPanel=false;fx=[];appear={};hl=null;winAt=0;stopUfo();lastTap={i:-1,t:0};drag=null;resetHistory();
  document.body.classList.add('tut');$('tutCard').hidden=false;

function tutSay(msg,miss){const p=$('tutText');p.textContent=msg;p.classList.toggle('miss',!!miss);

  $('tutNext').classList.toggle('wait',!st.next);
  $('tutSkip').style.visibility=st.done?'hidden':'visible';

  if(st.demo){cells=new Array(16).fill(0);cells[st.demo.alien]=3;st.demo.x.forEach(i=>cells[i]=1);if(!tut.demo)appear[st.demo.alien]=performance.now();tut.demo=true;render()}
  else if(tut.demo){tut.demo=false;cells=new Array(16).fill(0);appear={};render()}

}

function tutInput(i,isDouble){

function unitName(u){const n=puzzle.n;return u<n?t('row',u+1):u<2*n?t('col',u-n+1):t('thisRegion')}
function confineMsg(s){
  if(s.k===1){const a=s.S[0],b=s.T[0];
    const an=s.A===2?t('thisRegion'):unitName(a),bn=s.B===2?t('litRegion'):unitName(b),bn2=s.B===2?t('thatRegion'):unitName(b);
    return t('hConfine1',an,bn,bn2)}
  return t('hConfineK',s.k,s.A,s.B)}
function openHint(msg,cellsToRing){hints--;if(chOn&&ch)ch.hu=(ch.hu|0)+1;ring(cellsToRing);$('hintText').textContent=msg;$('hintCard').hidden=false;haptic('tick');sfx('hint');changed()}
function closeHint(silent){$('hintCard').hidden=true;hl=null;if(!silent){draw();if(pendingPanel){pendingPanel=false;showPanel()}}}
function hint(){
  if(over||sheetOpen()||!$('hintCard').hidden)return;
  if(humanShown(puzzle.disguise)&&allFound()){toast(t('suspect'),2600);if(!stuckAt)stuckAt=performance.now();kick();return}
  if(hints<=0){askHintAd();return}
  const {n,sol}=puzzle,N=n*n;
  for(let i=0;i<N;i++)if(cells[i]===1&&sol[Math.floor(i/n)]===i%n){cells[i]=0;keepCells([i]);openHint(t('hWrongX'),[i]);return}
  const miss=[];for(let i=0;i<N;i++)if(cells[i]===3)for(const j of G.block[i])if(cells[j]===0)miss.push(j);
  if(miss.length){miss.forEach(j=>cells[j]=2);keepCells(miss);openHint(t('hAround'),miss);return}
  const st=newState(G);
  for(let i=0;i<N;i++)if(cells[i]===3)stPlace(G,st,i);
  for(let i=0;i<N;i++)if(cells[i]===2||cells[i]===4)st.cand[i]=0;
  for(let guard=0;guard<300;guard++){
    let s=nextStep(G,st);if(s&&s.type==='dead')break;
    if(!s){s=chainStep(G,st);if(!s)break; // 達人：先読み
      if(cells[s.cell]===0){cells[s.cell]=2;keepCells([s.cell]);openHint(t('hChain',unitName(s.unit)),[s.cell,...G.units[s.unit]]);return}
      applyStep(G,st,s);continue}
    if(s.type==='single'){const i=s.cell;const before=cells.slice();cells[i]=3;revealAlien(i,true);if(autoOn())autoMark(i);keepCells(cells.map((v,k)=>v!==before[k]?k:-1).filter(k=>k>=0));
      openHint(t('hSingle',unitName(s.unit)),[i,...G.units[s.unit]]);checkWin();return}
    const vis=s.elim.filter(i=>cells[i]===0);
    if(vis.length){const ch=s.elim.filter(i=>editable(cells[i]));ch.forEach(i=>cells[i]=2);keepCells(ch);
      if(s.type==='contra')openHint(t('hContra',unitName(s.unit)),[s.cell,...s.cells]);
      else openHint(confineMsg(s),[...s.cells,...s.elim]);
      return}
    applyStep(G,st,s);
  }
  toast(t('noHint'));
}

    for(const i of o.aliens||[]){const [x,y]=at(i);g+=alienIcon(x+1,y+1,C-2)}
    for(const i of o.ghosts||[]){const [x,y]=at(i);g+=alienIcon(x+1,y+1,C-2,' opacity=".45"')+X(x+C/2,y+C/2,5.5,'var(--heart)',2.6)}
    g+=`<rect x="0" y="0" width="${W}" height="${W}" rx="3" fill="none" stroke="var(--line)" stroke-width="2.6"/>`+badge(W,0,!!o.ok);
    return `<svg viewBox="-6 -12 ${W+18} ${W+18}" aria-hidden="true">${g}</svg>`}
  const arrow=(x1,x2,y)=>`<path d="M${x1} ${y}H${x2}M${x2-5} ${y-5}L${x2} ${y}L${x2-5} ${y+5}" stroke="var(--muted)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const finger=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="6.5" fill="var(--ink)" opacity=".25"/><circle cx="${cx}" cy="${cy}" r="3.6" fill="var(--ink)" opacity=".6"/>`;
  const ringC=(cx,cy,r,cls)=>`<circle class="hw-ring${cls||''}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>`;
  const dots=(cx,y,k)=>{let g='';for(let t=0;t<k;t++)g+=`<circle cx="${cx+(t-(k-1)/2)*9}" cy="${y}" r="3" fill="var(--accent)"/>`;return g};
  const cell=(x,y,sz,col)=>`<rect x="${x}" y="${y}" width="${sz}" height="${sz}" rx="3" fill="var(--r${col})" stroke="var(--line)" stroke-width="2"/>`;
  const heart=(x,y,sz,cls)=>`<svg x="${x}" y="${y}" width="${sz}" height="${sz}" viewBox="0 0 24 24"${cls?` class="${cls}"`:''}><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.3 5.3 3.2 1.7-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="var(--heart)"/></svg>`;
  const R4=[0,0,1,1, 0,2,1,1, 2,2,3,1, 2,3,3,3];
  const one=Array(25).fill(2),two=Array(25).fill(1);
  const panels=[
    board(4,R4,{aliens:[1,7,8,14],ok:true}),                       // 区画ごとに1匹ずつ
    board(4,R4,{aliens:[2,11],tint:[2,3,6,7,11]}),                  // 同じ区画に2匹はダメ
    board(5,one,{aliens:[12],ghosts:[14,2],tint:[10,11,13,7,17,22]}), // 同じ行・列はダメ
    board(5,two,{aliens:[12],ghosts:[8],tint:[6,7,11,13,16,17,18]}),  // となり（ななめ含む）はダメ
  ];
  // タップ → ×　／　ダブルタップ → エイリアン
  const tap=`<svg viewBox="0 0 240 70" aria-hidden="true">
    ${ringC(28,30,10)}${finger(28,30)}${dots(28,60,1)}${arrow(50,72,30)}${cell(80,17,26,5)}<g class="hw-res">${X(93,30,6.5,'var(--x)',2.4)}</g>
    <path d="M120 8V62" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 4" opacity=".5"/>
    ${ringC(148,30,10)}${ringC(148,30,15,' d2')}${finger(148,30)}${dots(148,60,2)}${arrow(170,192,30)}${cell(200,17,26,5)}<g class="hw-res d2">${alienIcon(201,18,24)}</g></svg>`;
  // なぞる → まとめて×
  let seq='';for(let t=0;t<4;t++)seq+=`<g class="hw-seq" style="animation-delay:${(.22+t*.5).toFixed(2)}s">${X(20+t*24,26,5.5,'var(--x)',2.2)}</g>`;
  const dragP=`<svg viewBox="0 0 120 64" aria-hidden="true">${[0,1,2,3].map(t=>cell(8+t*24,14,24,1)).join('')}
    <path d="M20 54H92" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" opacity=".7"/>${arrow(84,94,54)}
    ${seq}<g class="hw-move">${finger(92,26)}</g></svg>`;
  // まちがえる → ハートが減る
  const missP=`<svg viewBox="0 0 120 64" aria-hidden="true">${cell(8,18,28,3)}
    <g class="hw-bad"><rect x="9" y="19" width="26" height="26" fill="var(--heart)" opacity=".25"/>${alienIcon(10,20,24,' opacity=".5"')}${X(22,32,7,'var(--heart)',2.8)}</g>
    ${arrow(44,62,32)}${heart(66,24,16)}${heart(83,24,16)}${heart(100,24,16,'hw-lose')}</svg>`;
  $('howto').innerHTML=panels.map(p=>`<div class="hw">${p}</div>`).join('')+`<div class="hw wide">${tap}</div><div class="hw">${dragP}</div><div class="hw">${missP}</div>`;
})();

/* ========== input ========== */
addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1||(e.target.closest&&e.target.closest('.board')))e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.target.closest&&e.target.closest('.board')))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0)});
document.addEventListener('touchend',e=>{if(e.target.closest&&e.target.closest('.board'))e.preventDefault()},{passive:false});

const DOUBLE=330;
let lastTap={i:-1,t:0},drag=null;
function cellAt(e){const c=$('cv');if(!c||!puzzle)return -1;const r=c.getBoundingClientRect(),n=puzzle.n;
  const x=Math.floor((e.clientX-r.left)/r.width*n),y=Math.floor((e.clientY-r.top)/r.height*n);
  return(x<0||y<0||x>=n||y>=n)?-1:y*n+x}
$('board').addEventListener('pointerdown',e=>{
  if(!e.isPrimary||over||sheetOpen()||!$('hintCard').hidden)return;const i=cellAt(e);if(i<0)return;const now=Date.now();
  if(!tut&&humanShown(i)){if(performance.now()-(appear[i]||0)>300)unmask();lastTap={i:-1,t:0};return} // 人間をタップ → 正体をあらわす
  if(lastTap.i===i&&now-lastTap.t<DOUBLE){ // ダブルタップ → エイリアン（1回目のタップの×は取り消す）
    if(lastTap.pushed){cells[i]=lastTap.prev;if(lastTap.hist)hist.pop()}
    lastTap={i:-1,t:0};drag=null;
    if(tut&&!TUT_STEPS[tut.step].free){tutInput(i,true);return}
    placeAlien(i);return}
  if(tut&&!tutInput(i,false)){lastTap={i,t:now,prev:cells[i],pushed:false};return}
  lastTap={i,t:now,prev:cells[i],pushed:false};
  if(!editable(cells[i]))return;
  const target=cells[i]===1?0:1;lastTap.pushed=true;if(!tut){pushHist();lastTap.hist=true}
  cells[i]=target;haptic('tick');sfx(target?'tap':'untap');changed();
  drag={target,seen:new Set([i])};try{$('board').setPointerCapture(e.pointerId)}catch(_){}
});
$('board').addEventListener('pointermove',e=>{
  if(!drag||!e.isPrimary)return;const i=cellAt(e);if(i<0||drag.seen.has(i))return;
  drag.seen.add(i);lastTap.i=-1;
  if(!editable(cells[i])||cells[i]===drag.target)return;cells[i]=drag.target;haptic('tick');sfx(drag.target?'tap':'untap');changed()});
addEventListener('pointerup',()=>{drag=null});addEventListener('pointercancel',()=>{drag=null});
tap($('hint'),()=>{if(tut&&!TUT_STEPS[tut.step].free)return;hint()});
tap($('undo'),()=>undo());
tap($('auto'),()=>{if(sheetOpen()||tut)return;if(chOn){toast(t('autoNoCh'));return}auto=!auto;store.set('auto',auto);if(auto&&!over)cells.forEach((v,i)=>{if(v===3)autoMark(i)});sfx('ui');changed();toast(auto?t('autoOn'):t('autoOff'))});

document.addEventListener('visibilitychange',()=>{if(document.hidden){saveNow();chT=0}else if(chOn)chT=Date.now()});
window.alienPause=()=>{saveNow()};
window.alienResume=()=>{if(chOn)chT=Date.now()};

$('adbar').hidden=true; // ブラウザ版：広告枠は出さない
document.body.classList.toggle('native',!!NATIVE);
/* ---------- 年齢の確認（初回だけ） ----------
   広告の種類（子ども向け／10代向け／大人向け）を決めるため、アプリ版の初回起動時に生まれた年をたずねる。
   Google Play のファミリー ポリシーに沿ったニュートラルな聞き方：初期値なし・どの年でも選べる・答えで遊べる内容は変わらない。
   答えは本体側（端末内）に年齢の区分だけ保存し、外部へは送らない。 */
function needAge(){try{return hasNative('getAgeGroup')&&!NATIVE.getAgeGroup()}catch(e){return false}}
let ageYear=0,ageDone=null;
function showAgeScreen(done){ageDone=done;ageYear=0;const y=new Date().getFullYear();let h='';
  for(let v=y;v>=y-100;v--)h+=`<button class="lvtile" data-y="${v}">${v}</button>`;
  $('ageIco').innerHTML=ALIEN;$('ageGrid').innerHTML=h;$('ageGrid').scrollTop=0;$('ageOk').disabled=true;
  $('ageSheet').hidden=false;syncModal()}
tap($('ageGrid'),tg=>{const b=tg.closest&&tg.closest('[data-y]');if(!b)return;sfx('ui');ageYear=+b.dataset.y;
  $('ageGrid').querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));b.classList.add('sel');$('ageOk').disabled=false});
tap($('ageOk'),()=>{if(!ageYear)return;sfx('ui');
  // 生まれた年だけでは誕生日前後で1歳ずれるので、若い側に寄せて判定する（13歳の可能性があれば子ども扱い）
  const a=new Date().getFullYear()-ageYear,g=a<=13?'child':a<=16?'teen':'adult';
  try{NATIVE.setAgeGroup(g)}catch(e){}
  $('ageSheet').hidden=true;syncModal();const d=ageDone;ageDone=null;if(d)d()});

$('chBtn').insertAdjacentHTML('beforeend',`<span class="lk">${LOCK}</span>`);rkLock();
applyTheme();applyLang();load(false);
function afterAge(){if(!store.get('tutDone',false))startTutorial()}
if(needAge())showAgeScreen(afterAge);else afterAge();
</script>
